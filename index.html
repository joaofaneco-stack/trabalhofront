<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA - A Nova Era da Evolução</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        :root{
            --bg: #0b0214; /* Fundo roxo ultra escuro */
            --bg-card: #160529; /* Cards roxo profundos */
            --primary: #FF007A; /* Rosa Neon Vibrante */
            --secondary: #9E00FF; /* Roxo Neon / Violeta */
            --accent: #FF52C4; /* Rosa Claro Elétrico */
            --white: #FFEBF7; /* Branco com sutil toque rosado */
            --muted: #9D8EA9; /* Texto secundário roxo acinzentado */
            --border: rgba(255, 0, 122, 0.15); /* Bordas baseadas no rosa neon */
            --gradient: linear-gradient(135deg, var(--secondary), var(--primary));
        }
        html{
            scroll-behavior:smooth;
        }
        body{
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--white);
            overflow-x:hidden;
            line-height: 1.6;
        }
    </style>
</head>
